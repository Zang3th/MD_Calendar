        <div class="tools">
          <button class="iconbtn" id="holidaysButton" type="button" aria-expanded="false" aria-controls="holidaysPanel" aria-label="Feiertage und Schulferien"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-flag"></use></svg></button>
          <button class="iconbtn" id="searchButton" type="button" aria-expanded="false" aria-controls="searchPanel" aria-label="Suchen (F)"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-search"></use></svg></button>
          <button class="iconbtn" id="backlogToggle" type="button" aria-pressed="false" aria-controls="backlog" aria-label="Backlog (B)"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-inbox"></use></svg></button>
        </div>
        <div class="edit">
          <button class="iconbtn" id="undo" type="button" aria-label="Rückgängig" disabled><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-undo"></use></svg></button>
          <button class="iconbtn" id="redo" type="button" aria-label="Wiederholen" disabled><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-redo"></use></svg></button>
          <button class="save" id="save" type="button" aria-label="Alles gespeichert"><span class="save__icon"><i class="save__dot"></i><svg class="ui-icon save__ok" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-check"></use></svg></span><span class="save__text"></span><b class="save__count"></b></button>
        </div>
        <button class="primary primary--icon" id="new" type="button" aria-label="Neuer Eintrag (N)"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-plus"></use></svg></button>
        <button class="iconbtn" id="optionsButton" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="optionsMenu" aria-label="Optionen"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-more"></use></svg></button>
      </div>
    </header>
    <main class="main glass">
      <section class="start" id="start" hidden>
        <img class="start__logo" src="res/logo/mark.svg" alt="" width="64" height="64">
        <h1 class="start__title">MD_Calendar</h1>
        <p class="start__text">Wähle den Ordner mit deinen Kalenderdateien.</p>
        <div class="start__actions">
          <button class="primary" id="reopen" type="button" hidden></button>
          <button class="btn btn--ghost" id="pick" type="button">Ordner öffnen</button>
        </div>
      </section>
      <div class="wk" id="week" hidden></div>
      <div class="month" id="month" hidden></div>
      <div class="cx" id="contacts" hidden></div>
    </main>
    <aside class="backlog glass" id="backlog" aria-label="Backlog" aria-hidden="true" inert>
      <h2 class="backlog__title"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-inbox"></use></svg>Backlog</h2>
      <div class="bl" id="backlogGroups"></div>
    </aside>
  </div>
  <div class="lasso" id="lasso" hidden></div>
  <section class="popover glass" id="holidaysPanel" aria-label="Feiertage und Schulferien" hidden>
    <header class="hp__head">
      <button class="iconbtn" type="button" data-year="-1" aria-label="Vorheriges Jahr"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-chevron-left"></use></svg></button>
      <span class="hp__year" id="holidaysYear"></span>
      <button class="iconbtn" type="button" data-year="1" aria-label="Nächstes Jahr"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-chevron-right"></use></svg></button>
    </header>
    <div class="hp__content" id="holidaysContent"></div>
  </section>
  <section class="popover popover--search glass" id="searchPanel" aria-label="Suche" hidden>
    <label class="sp__field"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-search"></use></svg><input id="searchInput" placeholder="Kalender durchsuchen …" aria-label="Kalender durchsuchen" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="searchResults"></label>
    <ul class="sp__results" id="searchResults" role="listbox" aria-label="Treffer"></ul>
  </section>
  <div class="menu popover glass" id="optionsMenu" role="menu" aria-label="Optionen" hidden>
    <button class="menu__item" id="sound" type="button" role="menuitem" data-muted="false"><svg class="ui-icon sound-on" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-volume"></use></svg><svg class="ui-icon sound-off" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-muted"></use></svg><span id="soundLabel">Ton aus</span></button>
    <label class="menu__item" role="menuitem"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-import"></use></svg><span>Kalender importieren (.ics)</span><input type="file" id="icsImport" accept=".ics,text/calendar" hidden></label>
    <button class="menu__item" id="helpButton" type="button" role="menuitem"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-keyboard"></use></svg><span>Tastenkürzel</span><kbd>?</kbd></button>
  </div>
  <div class="menu popover glass" id="contextMenu" role="menu" aria-label="Eintrag" hidden></div>
  <dialog class="dlg dlg--help" id="helpDialog" aria-labelledby="helpTitle">
    <div class="dlg__form">
      <header class="dlg__head"><span class="dlg__kind" id="helpTitle">Tastenkürzel</span><button class="dlg__x" type="button" data-close aria-label="Schließen (Esc)"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-close"></use></svg></button></header>
      <dl class="keys" id="helpKeys"></dl>
    </div>
  </dialog>
  <dialog class="dlg" id="dialog" aria-labelledby="dialogKind">
    <form class="dlg__form" method="dialog" novalidate>
      <header class="dlg__head">
        <span class="dlg__kind" id="dialogKind"></span>
        <button class="dlg__x" type="button" data-close aria-label="Schließen (Esc)"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-close"></use></svg></button>
      </header>
      <input class="dlg__title" id="dialogTitle" placeholder="Titel" aria-label="Titel" autocomplete="off">
      <div class="dlg__grid">
        <div class="dlg__field" id="dialogDateField">
          <span class="dlg__label"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-calendar"></use></svg><span id="dialogDateLabel">Datum</span>
            <button class="dlg__toggle" id="dialogMulti" type="button" aria-pressed="false" aria-label="Mehrtägig"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-range"></use></svg></button></span>
          <span class="dlg__range"><input class="dlg__input" id="dialogDate" placeholder="TT.MM.JJJJ" aria-label="Datum" autocomplete="off" inputmode="numeric" data-picker="date"><span class="dlg__until" aria-hidden="true">–</span><input class="dlg__input dlg__until" id="dialogEndDate" placeholder="TT.MM.JJJJ" aria-label="Bis" autocomplete="off" inputmode="numeric" data-picker="date"></span>
          <span class="dlg__hint" id="dialogDateHint"></span>
        </div>
        <div class="dlg__field" id="dialogTimeField"><span class="dlg__label"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-clock"></use></svg>Uhrzeit</span><span class="dlg__time"><input class="dlg__input" id="dialogStart" placeholder="Beginn" aria-label="Beginn (HH:MM)" autocomplete="off" inputmode="numeric" data-picker="time"><span aria-hidden="true">–</span><input class="dlg__input" id="dialogEnd" placeholder="Ende" aria-label="Ende (HH:MM)" autocomplete="off" inputmode="numeric" data-picker="time"></span></div>
        <div class="dlg__field dlg__field--wide" id="dialogRepeatField">
          <span class="dlg__label"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-repeat"></use></svg>Wiederholung</span>
          <span class="dlg__repeat">
            <select class="dlg__select" id="dialogRepeat" aria-label="Wiederholung"></select>
            <label class="dlg__interval" id="dialogIntervalField">alle <input class="dlg__input" id="dialogInterval" aria-label="Intervall" autocomplete="off" inputmode="numeric"> <span id="dialogIntervalUnit"></span></label>
          </span>
          <span class="dlg__weekdays" id="dialogWeekdays" role="group" aria-label="Wochentage"></span>
          <span class="dlg__hint" id="dialogUntil"></span>
        </div>
        <label class="dlg__field"><span class="dlg__label">Tag</span><select class="dlg__select" id="dialogTag" aria-label="Tag"><button type="button"><selectedcontent></selectedcontent></button></select></label>
        <label class="dlg__field"><span class="dlg__label"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-pin"></use></svg>Ort</span><input class="dlg__input" id="dialogLocation" placeholder="Kein Ort" autocomplete="off"></label>
      </div>
      <textarea class="dlg__note" id="dialogNote" placeholder="Notiz" aria-label="Notiz" rows="3"></textarea>
      <footer class="dlg__foot">
        <button class="btn btn--ghost" id="dialogBacklog" type="button"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-inbox"></use></svg>Ins Backlog</button>
        <button class="btn btn--danger" id="dialogDelete" type="button">Löschen</button>
        <button class="btn btn--danger" id="dialogDeleteOccurrence" type="button">Termin löschen</button>
        <button class="btn btn--ghost" id="dialogEndSeries" type="button">Ab hier beenden</button>
        <span class="dlg__spacer"></span>
        <button class="btn btn--primary" id="dialogApply" type="submit">Übernehmen <kbd>↵</kbd></button>
      </footer>
      <div class="picker" id="picker" hidden></div>
    </form>
  </dialog>
  <section class="notifications" id="notifications" aria-label="Benachrichtigungen" aria-live="polite"></section>
  <div class="app-tooltip" id="appTooltip" role="tooltip" hidden></div>
</body>
</html>
