  <div class="app">
    <header class="hdr glass">
      <div class="hdr__left">
        <button class="logo" id="logo" type="button" aria-label="Start page"><img src="res/logo/mark.svg" alt="" width="32" height="32"></button>
        <button class="hdr__title" id="title" type="button" aria-label="Today (T)" disabled><span class="hdr__titletext" id="titleText">MD_Calendar</span><span class="hdr__sizer" id="titleSizer" aria-hidden="true"></span></button>
        <span class="version" id="appVersion"></span>
        <div class="edit" data-open-only>
          <button class="primary primary--icon" id="new" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="contextMenu" aria-label="Add entry or import"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#hdr-plus"></use></svg></button>
          <input type="file" id="icsImport" accept=".ics,text/calendar" hidden>
          <button class="iconbtn" id="undo" type="button" aria-label="Undo" disabled><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#hdr-undo"></use></svg></button>
          <button class="iconbtn" id="redo" type="button" aria-label="Redo" disabled><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#hdr-redo"></use></svg></button>
          <button class="save" id="save" type="button" aria-label="All saved"><span class="save__icon"><i class="save__dot"></i><svg class="ui-icon save__ok" aria-hidden="true" viewBox="0 0 32 32"><use href="#hdr-check"></use></svg><i class="save__spin"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#hdr-spinner"></use></svg></i><svg class="ui-icon save__fail" aria-hidden="true" viewBox="0 0 32 32"><use href="#hdr-close"></use></svg></span></button>
        </div>
      </div>
      <div class="seg" role="group" aria-label="View" data-open-only>
        <span class="seg__thumb" aria-hidden="true"></span>
        <button id="viewWeek" type="button" aria-pressed="true" aria-label="Week (W)"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-week"></use></svg><span>Week</span></button>
        <button id="viewMonth" type="button" aria-pressed="false" aria-label="Month (M)"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-month"></use></svg><span>Month</span></button>
        <button id="viewContacts" type="button" aria-pressed="false" aria-label="Contacts (C)"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-contacts"></use></svg><span>Contacts</span></button>
      </div>
      <div class="hdr__right">
        <button class="iconbtn" data-open-only id="holidaysButton" type="button" aria-expanded="false" aria-controls="holidaysPanel" aria-label="Holidays"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#hdr-holiday"></use></svg></button>
        <button class="iconbtn" data-open-only id="backlogToggle" type="button" aria-pressed="false" aria-controls="backlog" aria-label="Backlog (B)"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#hdr-inbox"></use></svg></button>
        <button class="iconbtn" id="helpButton" type="button" aria-expanded="false" aria-controls="helpPanel" aria-label="Help (?)"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#hdr-help"></use></svg></button>
        <button class="iconbtn" id="sound" type="button" aria-pressed="false" aria-label="Mute"><svg class="ui-icon sound-on" aria-hidden="true" viewBox="0 0 32 32"><use href="#hdr-volume"></use></svg><svg class="ui-icon sound-off" aria-hidden="true" viewBox="0 0 32 32"><use href="#hdr-muted"></use></svg></button>
        <button class="iconbtn" id="optionsButton" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="optionsMenu" aria-label="Options"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#hdr-menu"></use></svg></button>
      </div>
    </header>
    <main class="main glass">
      <section class="start" id="start" hidden>
        <section class="recent" aria-labelledby="recentTitle">
          <h2 class="recent__title" id="recentTitle">Recent folders</h2>
          <ul class="recent__list" id="recentList"></ul>
        </section>
        <div class="start__actions">
          <button class="primary start__button" id="pick" type="button"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-folder"></use></svg>Open folder</button>
          <button class="start__button start__new" id="create" type="button"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-plus"></use></svg>New calendar</button>
        </div>
      </section>
      <div class="wk" id="week" hidden></div>
      <div class="month" id="month" hidden></div>
      <div class="cx" id="contacts" hidden></div>
    </main>
    <aside class="backlog glass" id="backlog" aria-label="Backlog" aria-hidden="true" inert>
      <h2 class="backlog__title"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-inbox"></use></svg>Backlog</h2>
      <div class="bl" id="backlogGroups"></div>
    </aside>
  </div>
  <div class="lasso" id="lasso" hidden></div>
  <section class="popover glass" id="holidaysPanel" aria-label="Holidays" hidden>
    <header class="hp__head">
      <button class="iconbtn" type="button" data-year="-1" aria-label="Previous year"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-chevron-left"></use></svg></button>
      <span class="hp__year" id="holidaysYear"></span>
      <button class="iconbtn" type="button" data-year="1" aria-label="Next year"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-chevron-right"></use></svg></button>
    </header>
    <div class="seg seg--tabs" role="tablist" aria-label="Lists">
      <span class="seg__thumb" id="holidaysThumb" aria-hidden="true"></span>
      <button type="button" role="tab" id="holidaysTabVacation" data-tab="vacation" aria-selected="true" aria-controls="holidaysContent">Vacation</button>
      <button type="button" role="tab" id="holidaysTabHolidays" data-tab="holidays" aria-selected="false" aria-controls="holidaysContent">Holidays</button>
      <button type="button" role="tab" id="holidaysTabSchool" data-tab="school" aria-selected="false" aria-controls="holidaysContent">School vacations</button>
    </div>
    <div class="hp__content hp__content--tabs" id="holidaysContent" role="tabpanel"></div>
  </section>
  <section class="search" id="searchPanel" aria-label="Search" hidden>
    <label class="sp__field"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-search"></use></svg><input id="searchInput" placeholder="Search calendar …" aria-label="Search calendar" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="searchResults"></label>
    <ul class="sp__results" id="searchResults" role="listbox" aria-label="Results"></ul>
  </section>
  <div class="focus" id="focus" hidden><section class="focus__card" role="dialog" aria-modal="true" tabindex="-1"></section></div>
  <div class="menu popover glass" id="contextMenu" role="menu" aria-label="Entry" hidden></div>
  <div class="menu popover glass" id="optionsMenu" role="menu" aria-label="Options" hidden>
    <button class="menu__item menu__item--switch" id="hideIcons" type="button" role="menuitemcheckbox" aria-checked="false"><span>Hide icons</span><span class="switch" aria-hidden="true"></span></button>
  </div>
  <section class="popover glass" id="helpPanel" aria-label="Shortcuts" hidden>
    <header class="hp__head hp__head--center"><span class="hp__year">Shortcuts</span></header>
    <div class="hp__content" id="helpContent"></div>
  </section>
  <dialog class="dlg" id="dialog" aria-label="Entry" tabindex="-1">
    <form class="dlg__form" method="dialog" novalidate>
      <div class="dlg__head">
        <button class="iconbtn dlg__dup" id="dialogDuplicate" type="button" aria-label="Duplicate" hidden><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-copy"></use></svg></button>
        <button class="iconbtn dlg__delete" id="dialogDelete" type="button" aria-label="Delete" aria-controls="dialogDeleteMenu" hidden><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-trash"></use></svg></button>
        <button class="iconbtn" id="dialogClose" type="button" aria-label="Close"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 32 32"><use href="#icon-close"></use></svg></button>
      </div>
      <input class="dlg__title" id="dialogTitle" placeholder="What is it?" aria-label="Title" autocomplete="off">
      <div class="dlg__bar">
        <div class="dlg__toks" id="dialogTokens" role="toolbar" aria-label="Details"></div>
        <button class="btn btn--primary" id="dialogApply" type="submit">Apply</button>
      </div>
      <div class="dlg__pop" id="dialogPop" tabindex="-1" hidden></div>
      <div class="menu glass dlg__menu" id="dialogDeleteMenu" role="menu" aria-label="Delete" hidden></div>
    </form>
  </dialog>
  <div class="watermark" id="watermark" hidden>© 2026 MD_Calendar <span id="watermarkVersion"></span> · Tim Krüger (Zang3th) · <a href="https://github.com/Zang3th" target="_blank" rel="noopener noreferrer">GitHub</a></div>
  <section class="notifications" id="notifications" aria-label="Notifications" aria-live="polite"></section>
  <div class="app-tooltip" id="appTooltip" role="tooltip" hidden></div>
</body>
</html>
